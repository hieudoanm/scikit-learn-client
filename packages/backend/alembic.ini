# skl Alembic configuration
[alembic]
# path to migration scripts
script_location = migrations

# Make the project root importable so migrations/env.py can import src.*
prepend_sys_path = .

# version location
version_locations = %(here)s/migrations/versions

# database URL
sqlalchemy.url = postgresql+asyncpg://skl:skl@localhost:5432/skl

# timezone to use when rendering the date
# within the migration file
# timezone =

# max length of characters to apply to the
# version file name
max_version_length = 64

# the template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version code template
# version_code_template =

# whether to use --sql offline mode
# offline = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
