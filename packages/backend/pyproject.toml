[project]
name = "backend"
version = "0.0.1"
description = "scikit-learn-client training API"
readme = "README.md"
requires-python = "==3.15.1"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "joblib==1.6.0",
]

[project.optional-dependencies]
onnx = [
    "ml_dtypes==0.6.0",
    "onnx==1.23.2",
    "skl2onnx==1.20.0",
    "onnxruntime==1.31.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    # Used by `scripts/export_openapi.py` to write the committed OpenAPI document.
    "pyyaml==6.0.3",
]

[tool.uv]
# The service is run directly (`uvicorn main:app`), so it is not packaged.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Make `src` (and `main`) importable for tests that exercise the pipeline
# directly, without needing the package installed (tool.uv: package = false).
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]
# `assert` is what tests are for (bandit's S101 applies to production code).
per-file-ignores = { "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
