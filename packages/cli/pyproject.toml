[project]
name = "skl-cli"
version = "0.0.1"
description = "scikit-learn-client CLI — train and export ONNX from a CSV"
readme = "README.md"
requires-python = "==3.15.1"
dependencies = [
    "click==8.5.0",
    "inquirer==3.4.1",
    "scikit-learn==1.9.1",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "joblib==1.6.0",
    "ml_dtypes==0.6.0",
    "onnx==1.23.2",
    "skl2onnx==1.20.0",
    "onnxruntime==1.31.0",
    "tabulate==0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyinstaller==6.22.3",
    "ruff==0.17.2",
]

[project.scripts]
skl = "skl:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
