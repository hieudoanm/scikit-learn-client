<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
  role="img"
  aria-label="SML"
>
  <title>SML</title>
  <desc>SML mark for light backgrounds: rounded box with a diagonal line.</desc>
  <rect
    x="32"
    y="32"
    width="192"
    height="192"
    rx="24"
    fill="#2563EB"
  />
  <line
    x1="192"
    y1="64"
    x2="64"
    y2="192"
    stroke="#FFFFFF"
    stroke-width="14"
    stroke-linecap="round"
  />
</svg>
